version: "0.2"
ignorePaths:
  - bin
  - obj
  - artifacts
  - "**/*.wasm"
  - "**/*.lock"
  - .github/**
  - src/KeetaNet.Anchor/Generated/**
  - tests/node-harness/node_modules/**
  - tests/node-harness/dist/**

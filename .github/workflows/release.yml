name: Release

on:
  push:
    tags: ["releases/v*"]

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create release from tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#releases/}"
          gh release create "${GITHUB_REF_NAME}" \
            --title "${version}" \
            --generate-notes
